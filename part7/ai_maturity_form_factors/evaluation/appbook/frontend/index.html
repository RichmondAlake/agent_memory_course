<!doctype html>
<html lang="en" data-theme="dark" data-sidebar="expanded">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Evaluation Studio — the AI Maturity Ladder</title>
  <meta name="description" content="Evaluate five AI form factors on one mortgage application, step by step: golden sets, three graders validated before use, evidence in Oracle AI Database, and release gates." />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("ffeval-theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
        var s = localStorage.getItem("ffeval-sidebar");
        document.documentElement.setAttribute("data-sidebar", s === "collapsed" ? "collapsed" : "expanded");
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/eval.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="stage" id="stage" tabindex="-1"></main>
  </div>
  <button class="scrim" id="scrim" aria-label="Close menu" hidden></button>
  <section class="data-explorer" id="data-explorer" aria-label="Database explorer">
    <div class="explorer-resizer" id="explorer-resizer" role="separator" aria-orientation="horizontal" aria-label="Resize data explorer"><i></i></div>
    <button class="explorer-handle" id="explorer-toggle" aria-expanded="false" aria-controls="explorer-body">
      <span class="explorer-title"><i class="db-glyph">DB</i><strong>Data Explorer</strong><span id="explorer-summary">Evidence and application tables, read-only</span></span>
      <span class="explorer-live"><i class="explorer-status-dot"></i><span>FFEVAL_ · FFAPP_</span></span>
      <span class="explorer-chevron" aria-hidden="true">⌃</span>
    </button>
    <div class="explorer-body two-col" id="explorer-body" hidden>
      <aside class="explorer-tables">
        <div class="explorer-section-head"><span>Tables</span><button id="explorer-refresh" title="Refresh">↻</button></div>
        <label class="explorer-search"><span class="sr-only">Filter by run id</span><input id="explorer-run" placeholder="Filter by run id…" /></label>
        <div class="explorer-table-list" id="explorer-table-list"></div>
      </aside>
      <section class="explorer-data">
        <div class="explorer-toolbar">
          <div><span class="explorer-eyebrow" id="explorer-role">SELECT A TABLE</span><h2 id="explorer-table-name">Evidence</h2></div>
          <div class="explorer-pagination"><button id="explorer-prev" aria-label="Previous page">←</button><span id="explorer-page">—</span><button id="explorer-next" aria-label="Next page">→</button></div>
        </div>
        <div class="explorer-grid-wrap" id="explorer-grid"><div class="explorer-empty">Choose a table to read its rows.</div></div>
      </section>
    </div>
  </section>
  <script src="/app.js"></script>
  <script src="/pages.js"></script>
</body>
</html>
